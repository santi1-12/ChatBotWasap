openapi: 3.1.0
info:
  title: WhatsAppBot.Api
  version: 1.0.0
  description: >
    Planning contract for the Admin-to-Api boundary and Meta webhook transport.
    Controllers and webhook handlers delegate use cases to Business.
servers:
  - url: https://{apiHost}
    variables:
      apiHost:
        default: localhost:7001
security:
  - bearerAuth: []
paths:
  /api/v1/admin/auth/login:
    post:
      operationId: loginAdministrator
      security: []
      summary: Authenticate an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDTO"
      responses:
        "200":
          description: Authenticated; access token is consumed server-side by Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEAuthResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/whatsapp/integration:
    get:
      operationId: getWhatsAppIntegration
      summary: Get current WhatsApp connection status and non-secret metadata
      responses:
        "200":
          description: Integration state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEWhatsAppIntegrationDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: disconnectWhatsAppIntegration
      summary: Disconnect the current WhatsApp integration through the Api use case
      responses:
        "204":
          description: Disconnected
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/whatsapp/embedded-signup:
    post:
      operationId: completeEmbeddedSignup
      summary: Complete server-side exchange and registration from Meta Embedded Signup
      description: Never accepts an access token or App Secret from the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddedSignupCompletionRequestDTO"
      responses:
        "200":
          description: Connection process result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEWhatsAppIntegrationDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ExternalDependencyFailure"
  /api/v1/admin/whatsapp/bot-configuration:
    get:
      operationId: getBotConfiguration
      summary: Get bot activation and reply mode
      responses:
        "200":
          description: Current bot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEBotConfigurationDTO"
    put:
      operationId: updateBotConfiguration
      summary: Update bot activation and reply mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotConfigurationRequestDTO"
      responses:
        "200":
          description: Updated bot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEBotConfigurationDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/admin/frequent-responses:
    get:
      operationId: listFrequentResponses
      summary: List configured bot responses
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Frequent response page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEFrequentResponsePageDTO"
    post:
      operationId: createFrequentResponse
      summary: Create a configured bot response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrequentResponseRequestDTO"
      responses:
        "201":
          description: Created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEFrequentResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/admin/frequent-responses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getFrequentResponse
      summary: Get response and associated expressions
      responses:
        "200":
          description: Frequent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEFrequentResponseDTO"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateFrequentResponse
      summary: Edit a configured bot response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrequentResponseRequestDTO"
      responses:
        "200":
          description: Updated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEFrequentResponseDTO"
    delete:
      operationId: deleteFrequentResponse
      summary: Delete a configured bot response
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/frequent-responses/{id}/active:
    patch:
      operationId: setFrequentResponseActive
      summary: Activate or deactivate a configured response
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Updated response state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEBoolean"
  /api/v1/admin/conversations:
    get:
      operationId: listConversations
      summary: List conversations for the authenticated tenant and connected integration
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEConversationPageDTO"
  /api/v1/admin/conversations/{id}:
    get:
      operationId: getConversation
      summary: Read tenant-authorized conversation details and paginated messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: beforeMessageId
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEConversationDetailDTO"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/conversations/{id}/actions:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: applyConversationAction
      summary: Apply a tenant-scoped conversation control action
      description: >
        Applies take/handoff, return-to-bot, close or reopen using an expected conversation
        version. The action is audited with the authenticated administrator or system actor.
        Human attention has priority over Bot processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationActionRequestDTO"
      responses:
        "200":
          description: Updated conversation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEConversationDetailDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/conversations/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: sendManualConversationMessage
      summary: Send a manual Admin text reply
      description: >
        Sends a text reply only while the conversation is in Humano attention mode. The API
        persists the Admin-origin message and applies the same WhatsApp window/template and
        tenant/concurrency guards as automated replies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMessageRequestDTO"
      responses:
        "202":
          description: Manual message accepted for the durable outbound workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEMessageDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/messages/{id}/media:
    get:
      operationId: getMessageMedia
      summary: Stream authorized conversation media through Api
      description: >
        Returns private media only after conversation authorization. The URL/storage reference
        is never public; expired media returns 410 while the message and allowed metadata remain
        in the conversation history.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Authorized media bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /webhooks/meta/whatsapp:
    get:
      operationId: verifyMetaWebhook
      security: []
      summary: Verify Meta webhook subscription challenge
      parameters:
        - in: query
          name: hub.mode
          schema:
            type: string
        - in: query
          name: hub.verify_token
          schema:
            type: string
        - in: query
          name: hub.challenge
          schema:
            type: string
      responses:
        "200":
          description: Raw challenge text when Verify Token matches
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Invalid verification token
    post:
      operationId: receiveMetaWebhook
      security: []
      summary: Validate Meta signature and persist webhook event
      description: >
        Validate the signature over raw bytes, then persist only a normalized allowlist of
        event fields needed for processing. Do not retain/log the complete raw webhook body.
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Meta Cloud API message, status, or account event
              additionalProperties: true
      responses:
        "200":
          description: Event durably accepted; empty response body
        "413":
          description: Webhook request exceeds the configured body size limit
        "415":
          description: Webhook content type is not application/json
        "400":
          description: Invalid event envelope
        "401":
          description: Invalid signature
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Input validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
    Unauthorized:
      description: Authentication failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
    Forbidden:
      description: Authorization failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
    Gone:
      description: Media expired according to the retention policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
    ExternalDependencyFailure:
      description: Meta/AI provider failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
    Conflict:
      description: Conversation version or attention-state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEError"
  schemas:
    ApiErrorDTO:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    ResponseEAuthResponseDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthResponseDTO"
    ResponseEWhatsAppIntegrationDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WhatsAppIntegrationDTO"
    ResponseEBotConfigurationDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BotConfigurationDTO"
    ResponseEFrequentResponseDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FrequentResponseDTO"
    ResponseEFrequentResponsePageDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FrequentResponsePageDTO"
    ResponseEConversationPageDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConversationPageDTO"
    ResponseEConversationDetailDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConversationDetailDTO"
    ResponseEMessageDTO:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageDTO"
    ResponseEBoolean:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              type: boolean
    ResponseEBase:
      type: object
      required: [success, traceId]
      properties:
        success:
          type: boolean
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiErrorDTO"
            - type: "null"
        traceId:
          type: string
    ResponseEError:
      allOf:
        - $ref: "#/components/schemas/ResponseEBase"
        - type: object
          properties:
            data:
              type: "null"
            error:
              $ref: "#/components/schemas/ApiErrorDTO"
    LoginRequestDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponseDTO:
      type: object
      required: [accessToken, expiresAtUtc]
      properties:
        accessToken:
          type: string
          description: Returned to the Admin server only, never to browser JavaScript.
        expiresAtUtc:
          type: string
          format: date-time
    EmbeddedSignupCompletionRequestDTO:
      type: object
      required: [authorizationCode, wabaId, onboardingType]
      properties:
        authorizationCode:
          type: string
          description: Single-use code returned by Meta SDK; exchange only server-to-server.
        wabaId:
          type: string
        phoneNumberId:
          type: [string, 'null']
          description: Optional for Standard or Coexistence; Api uses it when supplied, otherwise discovers it from the WABA and rejects zero or ambiguous matches.
        onboardingType:
          type: string
          enum: [Standard, Coexistence]
          description: Explicitly selects the Standard Cloud API or WhatsApp Business App Coexistence onboarding flow. Standard uses Meta:EmbeddedSignupConfigId; Coexistence uses its dedicated config when present and otherwise falls back to the Standard config.
    WhatsAppIntegrationDTO:
      type: object
      required: [connectionState, botEnabled]
      properties:
        tenantId:
          type: [string, 'null']
          format: uuid
        wabaId:
          type: [string, 'null']
        phoneNumberId:
          type: [string, 'null']
        businessPhoneNumber:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        onboardingType:
          type: [string, 'null']
          enum: [Standard, Coexistence, null]
        connectionState:
          type: string
          enum: [NotConnected, Configuring, Connected, Error, Unknown]
        connectionErrorCode:
          type: [string, 'null']
          description: Safe backend error classification; never contains provider response details or credentials.
        botEnabled:
          type: boolean
        connectedAtUtc:
          type: [string, 'null']
          format: date-time
        hasCredentialReference:
          type: boolean
          description: Indicates server-side credentials are configured; never returns a secret.
        metaAppId:
          type: string
          description: Public Meta application ID used by the Embedded Signup SDK.
        embeddedSignupConfigId:
          type: string
          description: Public Embedded Signup configuration ID.
        coexistenceEmbeddedSignupConfigId:
          type: [string, 'null']
          description: Optional public configuration ID dedicated to Coexistence; the Standard configuration ID is the fallback.
        metaGraphApiVersion:
          type: string
          description: Configured Graph API version used by the Meta SDK.
    BotConfigurationDTO:
      type: object
      required: [isBotEnabled, replyMode]
      properties:
        isBotEnabled:
          type: boolean
        replyMode:
          type: string
          enum: [FaqOnly, FaqThenAi, AiOnly]
    UpdateBotConfigurationRequestDTO:
      type: object
      required: [isBotEnabled, replyMode]
      properties:
        isBotEnabled:
          type: boolean
        replyMode:
          type: string
          enum: [FaqOnly, FaqThenAi, AiOnly]
    FrequentResponseRequestDTO:
      type: object
      required: [questionOrIntent, expressions, answerText, priority, isActive]
      properties:
        questionOrIntent:
          type: string
          maxLength: 500
        expressions:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 500
        answerText:
          type: string
          minLength: 1
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        category:
          type: [string, 'null']
          maxLength: 100
        isActive:
          type: boolean
    FrequentResponseDTO:
      allOf:
        - $ref: "#/components/schemas/FrequentResponseRequestDTO"
        - type: object
          required: [frequentResponseId, createdAtUtc, modifiedAtUtc]
          properties:
            frequentResponseId:
              type: integer
              format: int64
            createdAtUtc:
              type: string
              format: date-time
            modifiedAtUtc:
              type: string
              format: date-time
    FrequentResponsePageDTO:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FrequentResponseDTO"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
    ConversationPageDTO:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummaryDTO"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
    ConversationActionRequestDTO:
      type: object
      required: [action, expectedVersion]
      properties:
        action:
          type: string
          enum: [Take, Handoff, ReturnToBot, Close, Reopen]
          description: Human or lifecycle transition; automatic handoff also records a system actor and reason.
        reasonCode:
          type: [string, 'null']
          maxLength: 100
          description: Allowlisted handoff reason such as CustomerRequestedHuman, BotUnableToResolve, BusinessRule or BlockingError.
        expectedVersion:
          type: string
          description: Opaque conversation version used to reject stale concurrent actions.
    ManualMessageRequestDTO:
      type: object
      required: [text, expectedVersion]
      properties:
        text:
          type: string
          minLength: 1
          description: Initial POC manual reply type; outbound media composition is not included.
        expectedVersion:
          type: string
          description: Opaque conversation version used to revalidate Humano attention before enqueueing.
    ConversationSummaryDTO:
      type: object
      required: [conversationId, tenantId, contact, lastMessageAtUtc, status, lifecycleStatus, attentionMode]
      properties:
        conversationId:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        contact:
          type: string
        lastMessageAtUtc:
          type: string
          format: date-time
        status:
          type: string
          enum: [Open, Closed]
        lifecycleStatus:
          type: string
          enum: [Abierta, Cerrada]
        attentionMode:
          type: string
          enum: [Bot, Humano]
        assignedAdminId:
          type: [integer, 'null']
          format: int64
        assignedAdminEmail:
          type: [string, 'null']
          format: email
        version:
          type: string
          description: Opaque optimistic-concurrency version.
        lastMessagePreview:
          type: [string, 'null']
    ConversationDetailDTO:
      type: object
      required: [conversation, messages, auditEvents]
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationSummaryDTO"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageDTO"
        auditEvents:
          type: array
          items:
            $ref: "#/components/schemas/ConversationAuditEventDTO"
    ConversationAuditEventDTO:
      type: object
       required: [eventType, actorType, origin, occurredAtUtc]
      properties:
        eventType:
          type: string
          enum: [Take, AutomaticHandoff, ReturnToBot, Assign, Close, Reopen, ManualReply]
        actorType:
          type: string
          enum: [Admin, Bot, System]
        origin:
          type: string
          enum: [MetaCloudApi, AdminPanel, System, FutureWhatsAppBusinessApp]
        actorAdminId:
          type: [integer, 'null']
          format: int64
        reasonCode:
          type: [string, 'null']
        occurredAtUtc:
          type: string
          format: date-time
        resultingVersion:
          type: [string, 'null']
    MessageDTO:
      type: object
      required: [messageId, tenantId, direction, messageType, actorType, origin, processingState, createdAtUtc]
      properties:
        messageId:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [Inbound, Outbound]
        messageType:
          type: string
          enum: [Text, Audio, Image, Unsupported]
          description: Future media types may extend this enum; video, documents, location and contacts are not in this POC.
        actorType:
          type: string
          enum: [Customer, Bot, Admin, System]
        origin:
          type: string
          enum: [MetaCloudApi, AdminPanel, System, FutureWhatsAppBusinessApp]
        createdByAdminId:
          type: [integer, 'null']
          format: int64
        sourceInboundMessageId:
          type: [integer, 'null']
          format: int64
        text:
          type: [string, 'null']
        transcription:
          type: [string, 'null']
        mediaAvailable:
          type: boolean
        mediaUrl:
          type: [string, 'null']
          format: uri
          description: Authorized short-lived API URL, not a public object-store URL.
        mediaAvailabilityState:
          type: [string, 'null']
          enum: [Pending, Available, Expired, Failed, Deleted, null]
        mediaExpiresAtUtc:
          type: [string, 'null']
          format: date-time
        replySource:
          type: [string, 'null']
          enum: [FrequentResponse, AI, Admin, null]
        processingState:
          type: string
          enum: [Received, Processing, Completed, Failed, NoReply]
        outcomeCode:
          type: [string, 'null']
          description: Safe non-secret reason for a no-reply or rejected transition, including messaging policy blocks.
           enum: [MessagingWindowClosed, TemplateRequired, BotDisabled, NoFrequentResponse,
                  AiFallbackNotConfigured, UnsupportedMessageType, MetaSendFailed,
                  MetaDeliveryFailed, ConversationInHumanMode, ConversationClosed,
                  ConversationVersionConflict, IntegrationUnavailable, ManualSendFailed,
                  ManualReplyRequiresHuman, ManualReplyNotAuthorized, BlockingError,
                  MediaExpired, HandoffToHuman, null]
        deliveryState:
          type: [string, 'null']
          enum: [Pending, Sent, Delivered, Read, Failed, null]
        createdAtUtc:
          type: string
          format: date-time
